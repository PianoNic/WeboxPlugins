[package]
name = "xtask"
version = "0.0.0"
publish = false
description = "Builds the repository index: collects the built plugins per platform and writes index.json / index.min.json."
edition.workspace = true
license.workspace = true

[dependencies]
collabhost-plugin-api.workspace = true
libloading = "0.8"
semver = "1"
serde_json = "1"
sha2 = "0.10"
# signs the index (minisign format, Ed25519); Webox verifies with minisign-verify
minisign = "0.10"

[dev-dependencies]
# the verifier Webox uses: the tests check the signatures with it
minisign-verify = "0.3"
