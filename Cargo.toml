[workspace]
members = ["plugins/*", "xtask"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/PianoNic/WeboxPlugins"

[workspace.dependencies]
# The plugin interface lives in the Webox repository (plugin-api/). To build against a local Webox checkout instead, run
# scripts/use-local-api.ps1 (or .sh) once: it writes a git-ignored .cargo/config.toml with a [patch] for this source.
collabhost-plugin-api = "1.4"

# The crate is not on crates.io: it comes from the Webox repository through this patch. A [patch.crates-io] entry in
# .cargo/config.toml takes precedence over this one, which is how local builds and CI point it at a Webox checkout.
[patch.crates-io]
collabhost-plugin-api = { git = "https://github.com/PianoNic/Webox", branch = "main" }

# Plugins are loaded into Webox: small, stripped, and panic = "unwind" stays (the plugin-api shims catch panics at the
# boundary; "abort" would take Webox down with the plugin).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
