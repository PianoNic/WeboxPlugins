name: Build and publish

# Every pull request and push builds and tests all plugins for every platform. A push to main then publishes them: the
# binaries plus index.json / index.min.json go to the `repo` branch, which Webox reads as its plugin repository
# (https://raw.githubusercontent.com/PianoNic/WeboxPlugins/repo/index.min.json).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: ubuntu-latest
            platform: linux-x86_64
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check plugin metadata
        run: cargo run -p xtask -- check

      - run: cargo test

      - run: cargo build --release

      - name: Collect binaries and hashes
        run: cargo run --release -p xtask -- collect --platform ${{ matrix.platform }} --out dist

      - uses: actions/upload-artifact@v5
        with:
          name: plugins-${{ matrix.platform }}
          path: dist
          if-no-files-found: error

  publish:
    name: Publish to the repo branch
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/download-artifact@v5
        with:
          pattern: plugins-*
          path: dist

      - name: Check out the repo branch
        run: |
          if git fetch --depth 1 origin repo; then
            git worktree add -B repo repo FETCH_HEAD
          else
            git worktree add --orphan -b repo repo
          fi

      - name: Write the index
        run: cargo run -p xtask -- index --dist dist --repo repo

      # Webox checks repo/index.min.json.minisig with the public key built into it. TODO(owner): add the repository secrets
      # MINISIGN_SECRET_KEY (the minisign secret key file) and MINISIGN_PASSWORD; until then the index is published unsigned
      # (see xtask/src/sign.rs).
      - name: Sign the index
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: cargo run -p xtask -- sign --repo repo

      - name: Commit and push
        working-directory: repo
        run: |
          git config user.name "PianoNic"
          git config user.email "79938743+PianoNic@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "chore: published ${GITHUB_SHA::7}"
          git push origin repo
