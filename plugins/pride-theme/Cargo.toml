[package]
name = "collabhost_pride_theme"
version = "1.6.1"
description = "Rainbow accents across Webox, in the colours of the Pride flag."
authors = ["Webox examples"]
homepage = "https://github.com/PianoNic/WeboxPlugins/tree/main/plugins/pride-theme"
edition.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.webox]
name = "Pride Theme"
pkg = "dev.webox.plugins.pride-theme"

[lib]
crate-type = ["cdylib"]

[dependencies]
collabhost-plugin-api.workspace = true

[dev-dependencies]
# Only for the translation table check (i18n::untranslated).
serde_json = "1"
