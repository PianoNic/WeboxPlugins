[package]
name = "collabhost_who_reacted"
version = "1.0.0"
description = "Shows small avatars of the people who reacted next to each reaction, with their names on hover."
authors = ["Webox examples"]
homepage = "https://github.com/PianoNic/WeboxPlugins/tree/main/plugins/who-reacted"
edition.workspace = true
license.workspace = true
repository.workspace = true

# What the repository index says about this plugin (docs: CONTRIBUTING.md).
[package.metadata.webox]
name = "Wer hat reagiert"
pkg = "dev.webox.plugins.who-reacted"

[lib]
crate-type = ["cdylib"]

[dependencies]
collabhost-plugin-api.workspace = true
serde_json = "1"
