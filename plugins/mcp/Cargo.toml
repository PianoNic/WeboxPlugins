[package]
name = "collabhost_mcp"
version = "1.0.2"
description = "Lets a local AI (Claude Code, Claude Desktop, LM Studio, any MCP client) read your Webex through Webox as MCP tools; sending only when allowed and confirmed."
authors = ["Webox examples"]
homepage = "https://github.com/PianoNic/WeboxPlugins/tree/main/plugins/mcp"
edition.workspace = true
license.workspace = true
repository.workspace = true

# What the repository index says about this plugin (docs: CONTRIBUTING.md).
[package.metadata.webox]
name = "Webex MCP"
pkg = "dev.webox.plugins.mcp"

[lib]
crate-type = ["cdylib"]

[dependencies]
collabhost-plugin-api.workspace = true
serde_json = "1"
